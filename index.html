<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Hub</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app-container">
        <aside class="sidebar">
            <h2 class="logo">Document Hub</h2>
            <nav class="menu">
                <a href="#dashboard" class="menu-item active">대시보드</a>
                <a href="#summary" class="menu-item">요약 서비스</a>
                <a href="#history" class="menu-item">저장된 문서</a>
                <a href="#payment" class="menu-item">결제</a>
                <a href="#settings" class="menu-item">설정</a>
            </nav>
            <div class="user-actions">
                <button class="btn-logout">로그아웃 / 회원탈퇴</button>
                <button class="btn-profile">내 정보 변경</button>
            </div>
        </aside>

        <main class="main-content">
            <section class="auth-section card">
                <h3>로그인</h3>
                <form class="login-form">
                    <input type="text" placeholder="아이디" required>
                    <input type="password" placeholder="비밀번호" required>
                    <button type="submit" class="btn-primary">로그인</button>
                </form>
                <div class="auth-links">
                    <span>계정이 없으신가요?</span>
                    <a href="#register">회원가입</a>
                </div>
            </section>

            <section class="dashboard-section">
                <div class="section-header">
                    <h3>대시보드</h3>
                    <span class="status-badge">실시간 상태</span>
                </div>

                <div class="summary-box card">
                    <h4>새 문서 요약</h4>
                    <span class="badge-fast">Fast</span>
                    <p class="instruction">여기에 파일을 끌어다 놓거나</p>
                    <button class="btn-upload">파일 선택</button>
                    <p class="file-info">txt, pdf, docx, hwp 지원 · 최대 10MB</p>
                    <div class="alert-info">
                        현재 한글 파일(.hwp) 변환율 80%<br>
                        표, 수식, 이미지, 일부 특수문자는<br>
                        텍스트 인식이 누락될 수 있으므로<br>
                        [PDF] 변환 형식 변환을 권장합니다.
                    </div>
                </div>

                <div class="history-box card">
                    <h4>최근 저장된 요약문서</h4>
                    <div class="document-list-placeholder">
                        문서 목록이 여기에 표시됩니다.
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
